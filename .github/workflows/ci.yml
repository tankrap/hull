name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The workspace pulls keel from a pinned git rev; cold builds are slow, so cache aggressively.
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace

      # The Postgres pg_* tests skip without HULL_TEST_DATABASE_URL, so no DB service is needed;
      # the env-touching merge tests self-serialize.
      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Advisory only: the tree is far from rustfmt-default and we intentionally do not reformat it.
      - name: Rustfmt (advisory)
        run: cargo fmt --all --check
        continue-on-error: true

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (tsc && vite build)
        working-directory: web
        run: npm run build
