[workspace]
resolver = "2"
members = ["crates/hull-core", "crates/hull-scan", "crates/hull-server"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/tankrap/hull"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
