[workspace]
resolver = "2"
members = [
    "crates/hull-core",
    "crates/hull-scan",
    "crates/hull-plugin",
    "crates/hull-server",
]
# Plugins are NOT in this public repo — closed hosted plugins live in a separate private repo that
# depends on this one (the `hull-plugin` SDK + `hull-server` library). See PLUGINS.md.

[workspace.package]
version = "0.0.1"
edition = "2021"
# Open core: the whole server + SDK is Apache-2.0. Closed hosted plugins link the SDK at build time
# and live in a separate private tree — see PLUGINS.md.
license = "Apache-2.0"
repository = "https://github.com/tankrap/hull"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
