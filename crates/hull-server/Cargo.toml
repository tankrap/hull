[package]
name = "hull-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hull HTTP/JSON API + the reactive activity bridge (keeld QUIC coordination → SSE)."

# A library (the reusable server, with a plugin-registration hook) + a thin OSS binary. A hosted
# build lives in a SEPARATE PRIVATE repo: its own binary depends on this crate as a library and
# calls `hull_server::run(opts, |reg| hosted_plugins::register(reg))`. See PLUGINS.md.
[lib]
name = "hull_server"
path = "src/lib.rs"

[[bin]]
name = "hull-server"
path = "src/main.rs"

[dependencies]
hull-core = { path = "../hull-core" }
hull-scan = { path = "../hull-scan" }
hull-plugin = { path = "../hull-plugin" }
async-trait = "0.1"
# keel substrate, embedded directly (no serialization boundary). Pinned to a keel git-rev so the
# build is reproducible and standalone (no sibling checkout needed); bump the rev to adopt keel
# changes. Formalizing this embedding API (semver the embedded crates) is Linear NEW-1168.
keel-net = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-net" }
keel-git = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-git" }
keel-store = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-store" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
secp256k1 = { version = "0.29", features = ["std"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
axum = "0.7"
# HTTP hardening middleware: request timeout, body-size cap, and a panic guard (500 instead of a
# dropped connection). `tower` (limit) supplies the global concurrency cap.
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout", "limit", "catch-panic"] }
# `signal` powers graceful shutdown (SIGTERM/SIGINT) so a redeploy flushes in-flight state.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# git gzip-compresses the upload-pack request body by default; decode it before handing to keel-git.
flate2 = "1"
# QUIC ingress: daemons (via hull-agent) dial IN and stream coordination events up. Same stack as
# keel-net so the wire is consistent.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
# Outbound HTTP: Hull dispatches a standard CI job payload to the repo's configured CI endpoint
# (Hull owns no queue — the CI system does whatever it wants and posts the verdict back).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Content-addressed source fetch: a CI/reviewer runner pulls the change's keel TREE (by tree_id) as
# a tar archive — keel-native, NOT git. git smart-HTTP stays strictly for interop/mirroring.
tar = "0.4"
# Content-address the review audit artifact (D8) — same hash family keel uses.
blake3 = "1"
# Passkey (WebAuthn) accounts: server-side registration/authentication ceremonies. Passwordless.
webauthn-rs = "0.5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# Per-user agent login relay: `claude setup-token` needs a real terminal to emit the authorize URL
# and read the paste-back code, so we drive it under a pseudo-terminal.
portable-pty = "0.8"
# Encrypt per-user credential bundles at rest (AEAD, server-key sealed tarball).
chacha20poly1305 = "0.10"
# Structured, leveled logging. `env-filter` reads RUST_LOG; `json` gives machine-parseable lines in
# the prod profile (dev stays human-readable/compact). One request-log line per request is emitted
# from the observability middleware; startup lines go through tracing too.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── CI sandbox (Phase 3) ────────────────────────────────────────────────────────────────────────
# The built-in CI runner is the one place Hull executes attacker-controlled repo code. The
# `SandboxedCiRunner` re-execs the current binary as a `ci-sandbox` helper that drops resource
# limits (libc setrlimit) and, on Linux, a Landlock filesystem jail before exec'ing the test command.
# `libc` (setrlimit + group-kill) is unix-only; `landlock` is Linux-only — both are gated so non-unix
# builds pull neither.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
# The sandbox tests re-exec the *test* binary as the `ci-sandbox` helper (via `current_exe`). A
# constructor lets that helper dispatch before libtest's main would otherwise swallow the argv.
ctor = "0.2"
