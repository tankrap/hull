[package]
name = "hull-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hull HTTP/JSON API + the reactive activity bridge (keeld QUIC coordination → SSE)."

# A library (the reusable server, with a plugin-registration hook) + a thin OSS binary. A hosted
# build lives in a SEPARATE PRIVATE repo: its own binary depends on this crate as a library and
# calls `hull_server::run(opts, |reg| hosted_plugins::register(reg))`. See PLUGINS.md.
[lib]
name = "hull_server"
path = "src/lib.rs"

[[bin]]
name = "hull-server"
path = "src/main.rs"

[dependencies]
hull-core = { path = "../hull-core" }
hull-scan = { path = "../hull-scan" }
hull-plugin = { path = "../hull-plugin" }
# keel substrate, embedded directly (no serialization boundary). Pinned to a keel git-rev so the
# build is reproducible and standalone (no sibling checkout needed); bump the rev to adopt keel
# changes. Formalizing this embedding API (semver the embedded crates) is Linear NEW-1168.
keel-net = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-net" }
keel-git = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-git" }
keel-store = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-store" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# git gzip-compresses the upload-pack request body by default; decode it before handing to keel-git.
flate2 = "1"
# QUIC ingress: daemons (via hull-agent) dial IN and stream coordination events up. Same stack as
# keel-net so the wire is consistent.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
