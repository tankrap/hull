[package]
name = "hull-review-openrouter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI reviewer plugin (Epic D): reviews a change with a model via OpenRouter, returning a constrained-schema verdict. Implements hull-plugin's Reviewer; belongs in the hosted build."

[dependencies]
hull-plugin = { path = "../hull-plugin" }
hull-core = { path = "../hull-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# Blocking HTTP with no background runtime (Reviewer::review is sync, run on a blocking task) —
# reqwest::blocking spawns a runtime that panics if dropped in an async context; ureq doesn't.
ureq = { version = "2", features = ["json", "tls"] }
